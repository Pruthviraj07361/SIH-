<main class="flex-1 p-container-padding max-w-5xl mx-auto w-full">
<div class="mb-section-margin">
<h2 class="font-headline-md text-headline-md text-primary mb-2">Performance Analytics</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Your overall academic standing and quiz performance.</p>
<div class="h-1 w-24 bg-accent-gold mt-4 rounded-full"></div>
</div>
<div id="analytics-content">
<p class="font-body-md text-on-surface-variant">Loading analytics…</p>
</div>
</main>

<script>
let CURRENT_USER_ID = null;

async function load() {
  const container = document.getElementById("analytics-content");
  try {
    const data = await apiGet(`/analytics/${CURRENT_USER_ID}`);
    if (data.breakdown.length === 0) {
      container.innerHTML = `<p class="font-body-md text-on-surface-variant">No quiz attempts yet — take a quiz to see analytics here.</p>`;
      return;
    }
    const overall = Math.round(data.breakdown.reduce((s, t) => s + t.accuracy, 0) / data.breakdown.length);

    container.innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-12 gap-gutter">
        <div class="col-span-1 md:col-span-5 bg-surface-container-lowest rounded-xl p-6 card-elevation flex flex-col items-center justify-center">
          <h3 class="font-headline-md text-headline-md text-primary w-full text-left mb-4">Overall Score</h3>
          <p class="font-headline-lg text-display-lg text-primary-container">${overall}%</p>
          <p class="font-body-md text-on-surface-variant mt-2">Total Average</p>
        </div>
        <div class="col-span-1 md:col-span-7 bg-surface-container-lowest rounded-xl p-6 card-elevation">
          <h3 class="font-headline-md text-headline-md text-primary mb-6">Performance by Topic</h3>
          <div class="space-y-6">
            ${data.breakdown.map(t => `
              <div>
                <div class="flex justify-between mb-2">
                  <span class="font-data-mono text-data-mono text-primary">${t.topic}</span>
                  <span class="font-data-mono text-data-mono font-bold ${t.accuracy >= 70 ? 'text-secondary' : t.accuracy >= 50 ? 'text-accent-gold' : 'text-error'}">${t.accuracy}%</span>
                </div>
                <div class="w-full bg-surface-container-low rounded-full h-2">
                  <div class="${t.accuracy >= 70 ? 'bg-secondary' : t.accuracy >= 50 ? 'bg-accent-gold' : 'bg-error'} h-2 rounded-full" style="width: ${t.accuracy}%"></div>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
        <div class="col-span-1 md:col-span-12 bg-surface-container-lowest rounded-xl p-6 card-elevation">
          <div class="flex items-center gap-2 mb-4">
            <span class="material-symbols-outlined text-error">trending_down</span>
            <h3 class="font-headline-md text-headline-md text-primary">Weakest Topic</h3>
          </div>
          <p class="font-body-md text-on-surface-variant">${data.weakest_topic ?? "N/A"} — <a class="text-primary-container underline" href="review.html">review your wrong answers</a> here.</p>
        </div>
      </div>
    `;
  } catch (err) {
    container.innerHTML = `<p class="text-error">Couldn't load analytics (${err.message}). Is the backend running at ${API_BASE}?</p>`;
  }
}

(async () => {
  CURRENT_USER_ID = await requireLogin();
  if (!CURRENT_USER_ID) return;
  load();
})();
</script>
