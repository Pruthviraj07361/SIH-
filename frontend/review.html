<p class="font-body-md text-on-surface-variant">Loading review items…</p>

<script src="config.js"></script>
<script>
async function load() {
  const userId = await requireLogin();
  if (!userId) return;

  const container = document.getElementById("review-content");
  try {
    const items = await apiGet(`/review/${userId}`);
    if (items.length === 0) {
      container.innerHTML = `<p class="font-body-md text-on-surface-variant">No wrong answers yet — nice work, or you haven't taken a quiz.</p>`;
      return;
    }
    container.innerHTML = items.map(item => `
      <article class="bg-surface-container-lowest rounded-xl p-6 card-elevation">
        <p class="font-body-lg text-body-lg text-primary mb-6">${item.questions.question_text}</p>
        <div class="space-y-4 mb-2">
          <div class="p-4 rounded-lg bg-error-container border border-error/20 flex gap-3 items-start">
            <span class="material-symbols-outlined text-error mt-0.5">cancel</span>
            <div>
              <p class="font-label-caps text-label-caps text-error mb-1 uppercase">Your Answer</p>
              <p class="font-body-md text-body-md text-on-error-container">${item.selected_answer}</p>
            </div>
          </div>
          <div class="p-4 rounded-lg bg-secondary-container/20 border border-secondary/30 flex gap-3 items-start">
            <span class="material-symbols-outlined text-secondary mt-0.5">check_circle</span>
            <div>
              <p class="font-label-caps text-label-caps text-secondary mb-1 uppercase">Correct Answer</p>
              <p class="font-body-md text-body-md text-on-surface">${item.questions.correct_answer}</p>
            </div>
          </div>
        </div>
        ${item.questions.explanation ? `
          <div class="bg-surface-container-low rounded-lg p-5 border border-outline-variant mt-2">
            <div class="flex items-center gap-2 mb-2">
              <span class="material-symbols-outlined text-primary-container text-sm">auto_awesome</span>
              <span class="font-label-caps text-label-caps text-primary-container tracking-widest uppercase">AI Insight</span>
            </div>
            <p class="font-body-md text-body-md text-on-surface-variant">${item.questions.explanation}</p>
          </div>` : ""}
      </article>
    `).join("");
  } catch (err) {
    container.innerHTML = `<p class="text-error">Couldn't load review items (${err.message}). Is the backend running at ${API_BASE}?</p>`;
  }
}
load();
</script>
