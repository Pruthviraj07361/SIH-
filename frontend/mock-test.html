<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudyAI - Mock Test</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: {
              "colors": {"primary":"#041627","surface-container-low":"#f2f4f6","secondary":"#006b5f","background":"#f7f9fb","error":"#ba1a1a","surface-container-lowest":"#ffffff","surface":"#f7f9fb","surface-variant":"#e0e3e5","on-background":"#191c1e","outline":"#74777d","on-surface-variant":"#44474c","error-container":"#ffdad6","on-error-container":"#93000a","secondary-container":"#62fae3"},
              "borderRadius": {"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},
              "spacing": {"unit":"4px","section-margin":"32px","container-padding":"20px","card-gap":"12px","gutter":"16px"},
              "fontFamily": {"headline-md":["Playfair Display"],"data-mono":["Inter"],"label-caps":["Inter"],"body-md":["Inter"],"body-lg":["Inter"]},
              "fontSize": {"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"data-mono":["14px",{"lineHeight":"20px","fontWeight":"500"}],"label-caps":["12px",{"lineHeight":"16px","letterSpacing":"0.05em","fontWeight":"600"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}]}
      }}}
      </script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<header class="w-full top-0 sticky z-40 bg-surface shadow-sm">
<div class="flex items-center justify-between px-container-padding py-unit w-full h-[64px]">
<a class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low text-on-surface-variant" href="index.html">
<span class="material-symbols-outlined">close</span>
</a>
<h1 class="font-headline-md text-primary tracking-tight">Weekly Mock Test</h1>
<span></span>
</div>
<div class="w-full h-1 bg-surface-container-low relative z-30">
<div class="h-full bg-secondary" id="mock-progress-bar" style="width: 0%"></div>
</div>
</header>
<main class="flex-grow w-full max-w-3xl mx-auto px-container-padding py-section-margin flex flex-col gap-8" id="main-content">
<p class="text-on-surface-variant">Loading this week's questions…</p>
</main>

<script src="config.js"></script>
<script>
let questions = [];
let currentIndex = 0;
let selected = null;
let score = 0;
let sessionId = null;

async function init() {
  const main = document.getElementById("main-content");
  try {
    const sessionForm = new FormData();
    sessionForm.append("user_id", DEMO_USER_ID);
    sessionForm.append("type", "weekly_mock");
    const session = await apiPostForm("/quiz-sessions", sessionForm);
    sessionId = session.id;

    questions = await apiGet(`/mock-test/${DEMO_USER_ID}`);
    if (questions.length === 0) {
      main.innerHTML = `<p class="text-on-surface-variant">No materials uploaded this week yet — the mock test pools questions from this week's uploads.</p>`;
      return;
    }
    renderQuestion();
  } catch (err) {
    main.innerHTML = `<p class="text-error">Couldn't load mock test (${err.message}). Is the backend running at ${API_BASE}?</p>`;
  }
}

function renderQuestion() {
  const q = questions[currentIndex];
  selected = null;
  document.getElementById("mock-progress-bar").style.width = `${(currentIndex / questions.length) * 100}%`;
  const optionEntries = Object.entries(q.options);

  document.getElementById("main-content").innerHTML = `
    <article class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(26,43,60,0.05)] border border-surface-variant p-6 md:p-8 flex flex-col gap-6">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-surface-container-low text-primary flex items-center justify-center font-data-mono text-data-mono font-bold">${currentIndex + 1}</div>
        <span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Question ${currentIndex + 1} of ${questions.length}</span>
      </div>
      <p class="font-body-lg text-on-background leading-relaxed font-medium">${q.question_text}</p>
      <div class="flex flex-col gap-3 mt-2" id="options-container">
        ${optionEntries.map(([key, text]) => `
          <label class="relative group cursor-pointer flex">
            <input class="peer sr-only" name="mock-answer" type="radio" value="${key}"/>
            <div class="w-full flex items-center gap-4 p-4 rounded-lg border border-surface-variant bg-surface-container-lowest hover:bg-surface-container-low/50 transition-all">
              <div class="w-5 h-5 rounded-full border-2 border-outline flex-shrink-0"></div>
              <span class="font-body-md text-on-surface">${text}</span>
            </div>
          </label>
        `).join("")}
      </div>
    </article>
    <div id="feedback"></div>
    <div class="flex justify-end">
      <button class="bg-primary text-on-primary font-data-mono font-semibold py-3 px-6 rounded-lg shadow-sm opacity-50 cursor-not-allowed" id="submit-btn" disabled>
        Submit
      </button>
    </div>
  `;

  document.querySelectorAll('input[name="mock-answer"]').forEach(radio => {
    radio.addEventListener("change", () => {
      selected = radio.value;
      const btn = document.getElementById("submit-btn");
      btn.disabled = false;
      btn.classList.remove("opacity-50", "cursor-not-allowed");
    });
  });
  document.getElementById("submit-btn").addEventListener("click", submitAnswer);
}

async function submitAnswer() {
  if (!selected) return;
  const q = questions[currentIndex];
  const form = new FormData();
  form.append("user_id", DEMO_USER_ID);
  form.append("question_id", q.id);
  form.append("quiz_session_id", sessionId);
  form.append("selected_answer", selected);

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;

  try {
    const result = await apiPostForm("/attempts", form);
    if (result.is_correct) score++;
    document.getElementById("feedback").innerHTML = `
      <div class="p-4 rounded-lg ${result.is_correct ? 'bg-secondary-container/30 border border-secondary' : 'bg-error-container border border-error/30'}">
        <p class="font-body-md font-bold ${result.is_correct ? 'text-secondary' : 'text-on-error-container'}">
          ${result.is_correct ? "Correct!" : `Incorrect — correct answer: ${q.correct_answer}`}
        </p>
      </div>`;
    btn.textContent = currentIndex < questions.length - 1 ? "Next Question" : "Finish Test";
    btn.disabled = false;
    btn.onclick = nextQuestion;
    document.querySelectorAll('input[name="mock-answer"]').forEach(r => r.disabled = true);
  } catch (err) {
    document.getElementById("feedback").innerHTML = `<p class="text-error">Couldn't submit (${err.message})</p>`;
  }
}

async function nextQuestion() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    const form = new FormData();
    form.append("score", score);
    try { await apiPatchForm(`/quiz-sessions/${sessionId}/complete`, form); } catch (e) {}
    document.getElementById("main-content").innerHTML = `
      <div class="text-center py-12">
        <h2 class="font-headline-md text-primary mb-2">Mock Test Complete</h2>
        <p class="text-on-surface-variant mb-6">You scored ${score} / ${questions.length}</p>
        <a class="bg-primary text-on-primary px-6 py-3 rounded-lg inline-block" href="analytics.html">View Analytics</a>
      </div>`;
    document.getElementById("mock-progress-bar").style.width = "100%";
    return;
  }
  renderQuestion();
}

init();
</script>
</body></html>
