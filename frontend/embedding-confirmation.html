<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Embedding Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
            "colors": {"on-tertiary-fixed":"#281802","primary":"#041627","surface-container-low":"#f2f4f6","secondary":"#006b5f","background":"#f7f9fb","on-primary-fixed-variant":"#38485a","error":"#ba1a1a","surface-container":"#eceef0","surface-container-lowest":"#ffffff","on-tertiary-fixed-variant":"#584326","outline-variant":"#c4c6cd","on-primary-container":"#8192a7","tertiary":"#211200","on-secondary-fixed-variant":"#005047","on-primary":"#ffffff","primary-fixed":"#d2e4fb","secondary-fixed":"#62fae3","on-tertiary":"#ffffff","on-secondary-container":"#007165","on-tertiary-container":"#a88c69","on-secondary":"#ffffff","tertiary-container":"#38260b","surface":"#f7f9fb","primary-fixed-dim":"#b7c8de","inverse-surface":"#2d3133","surface-variant":"#e0e3e5","secondary-fixed-dim":"#3cddc7","inverse-primary":"#b7c8de","on-background":"#191c1e","surface-tint":"#4f6073","surface-dim":"#d8dadc","surface-container-highest":"#e0e3e5","on-error":"#ffffff","tertiary-fixed":"#feddb5","surface-container-high":"#e6e8ea","inverse-on-surface":"#eff1f3","on-surface":"#191c1e","tertiary-fixed-dim":"#e1c29b","outline":"#74777d","on-primary-fixed":"#0b1d2d","on-surface-variant":"#44474c","on-secondary-fixed":"#00201c","error-container":"#ffdad6","on-error-container":"#93000a","primary-container":"#1a2b3c","surface-bright":"#f7f9fb","secondary-container":"#62fae3"},
            "borderRadius": {"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},
            "spacing": {"unit":"4px","section-margin":"32px","container-padding":"20px","card-gap":"12px","gutter":"16px"},
            "fontFamily": {"display-lg":["Playfair Display"],"headline-md":["Playfair Display"],"data-mono":["Inter"],"label-caps":["Inter"],"body-md":["Inter"],"display-lg-mobile":["Playfair Display"],"body-lg":["Inter"]},
            "fontSize": {"display-lg":["40px",{"lineHeight":"48px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"data-mono":["14px",{"lineHeight":"20px","fontWeight":"500"}],"label-caps":["12px",{"lineHeight":"16px","letterSpacing":"0.05em","fontWeight":"600"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"display-lg-mobile":["32px",{"lineHeight":"40px","fontWeight":"700"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}]}
    }}}
    </script>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col items-center pb-24">
<header class="w-full top-0 sticky bg-surface dark:bg-background shadow-sm z-40">
<div class="flex items-center justify-between px-container-padding py-unit w-full">
<a class="text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full p-2" href="index.html">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary md:font-display-lg md:text-display-lg">StudyAI</h1>
<span></span>
</div>
</header>
<main class="w-full max-w-lg px-container-padding pt-12 flex flex-col items-center" id="main-content">
<p class="font-body-md text-on-surface-variant">Loading material status…</p>
</main>

<script src="config.js"></script>
<script>
async function load() {
  const materialId = qs("material_id");
  const main = document.getElementById("main-content");
  if (!materialId) {
    main.innerHTML = `<p class="text-error">No material_id in the URL. Go back and upload a PDF first.</p>`;
    return;
  }
  try {
    const m = await apiGet(`/materials/${materialId}`);
    const isDone = m.embedding_status === "done";
    main.innerHTML = `
      <div class="flex flex-col items-center mb-8">
        <div class="w-24 h-24 rounded-full bg-secondary-fixed flex items-center justify-center mb-6 shadow-[0px_8px_32px_rgba(0,107,95,0.2)]">
          <span class="material-symbols-outlined text-secondary text-5xl font-bold">${isDone ? "check_circle" : "hourglass_top"}</span>
        </div>
        <h2 class="font-headline-md text-headline-md text-primary text-center">${isDone ? "Processing Complete" : "Still Processing…"}</h2>
        <p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">${m.filename}</p>
      </div>
      <div class="w-full bg-surface-container-lowest rounded-xl p-6 shadow-[0px_4px_20px_rgba(26,43,60,0.05)] border border-outline-variant mb-8">
        <div class="flex justify-between items-center mb-4">
          <span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Status</span>
          <div class="flex items-center gap-1 text-secondary">
            <span class="font-label-caps text-label-caps font-bold">${m.embedding_status.toUpperCase()}</span>
          </div>
        </div>
        <div class="space-y-4">
          <div class="flex justify-between items-center py-2 border-t border-surface-variant">
            <span class="font-body-md text-body-md text-on-surface-variant">Chunks Generated</span>
            <span class="font-data-mono text-data-mono font-bold text-primary">${m.chunk_count}</span>
          </div>
          <div class="flex justify-between items-center py-2 border-t border-surface-variant">
            <span class="font-body-md text-body-md text-on-surface-variant">Topics Extracted</span>
            <span class="font-data-mono text-data-mono font-bold text-secondary">${m.topics.length}</span>
          </div>
        </div>
        ${m.topics.length ? `<ul class="mt-4 text-sm text-on-surface-variant list-disc pl-5">${m.topics.map(t => `<li>${t.topic_name}</li>`).join("")}</ul>` : ""}
      </div>
      <div class="w-full space-y-3">
        <button class="w-full bg-primary text-on-primary font-body-md text-body-md font-medium py-4 rounded-lg shadow-sm hover:bg-primary-container transition-colors"
                onclick="window.location.href='quiz.html?material_id=${materialId}'">Start Quiz</button>
        <button class="w-full bg-surface-container-lowest border border-primary text-primary font-body-md text-body-md font-medium py-4 rounded-lg shadow-sm hover:bg-surface-container-low transition-colors"
                onclick="window.location.href='analytics.html'">View Analytics</button>
      </div>
    `;
  } catch (err) {
    main.innerHTML = `<p class="text-error">Couldn't load material (${err.message}). Is the backend running at ${API_BASE}?</p>`;
  }
}
load();
</script>
</body></html>
