<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
let CURRENT_USER_ID = null;
async function loadMaterials() {
  const container = document.getElementById("materials-list");
  try {
    const materials = await apiGet(`/materials?user_id=${CURRENT_USER_ID}`);
    if (materials.length === 0) {
      container.innerHTML = `<p class="font-body-md text-on-surface-variant col-span-2">No materials yet — upload a PDF to get started.</p>`;
      return;
    }
    container.innerHTML = materials.map(m => `
      <div class="bg-surface-container-lowest rounded-xl card-elevation p-4 flex flex-col relative card-interactive cursor-pointer"
           onclick="window.location.href='embedding-confirmation.html?material_id=${m.id}'">
        <div class="absolute top-4 right-4 flex items-center gap-1 ${m.embedding_status === 'done' ? 'text-secondary' : 'text-on-primary-container'}">
          <span class="material-symbols-outlined text-sm">${m.embedding_status === 'done' ? 'check_circle' : 'sync'}</span>
          <span class="font-label-caps text-label-caps uppercase">${m.embedding_status}</span>
        </div>
        <div class="flex items-start gap-4 mb-4 mt-2">
          <div class="w-10 h-10 rounded bg-error-container text-on-error-container flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined">picture_as_pdf</span>
          </div>
          <div>
            <h4 class="font-data-mono text-data-mono text-primary truncate pr-20">${m.filename}</h4>
            <p class="font-body-md text-body-md text-sm text-on-surface-variant mt-1">Added ${new Date(m.upload_date).toLocaleDateString()}</p>
          </div>
        </div>
      </div>
    `).join("");
  } catch (err) {
    container.innerHTML = `<p class="text-error col-span-2">Couldn't reach the backend (${err.message}). Is it running at ${API_BASE}?</p>`;
  }
}

document.getElementById("upload-btn").addEventListener("click", () => document.getElementById("pdf-input").click());

document.getElementById("pdf-input").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById("upload-status");
  status.classList.remove("hidden");
  status.textContent = "Uploading and processing — this can take a minute (embedding + topic + quiz generation)…";

  const formData = new FormData();
  formData.append("user_id", CURRENT_USER_ID);
  formData.append("file", file);

  try {
    const result = await apiPostForm("/materials/upload", formData);
    status.textContent = `Done — ${result.chunks_created} chunks, ${result.topics_found} topics, ${result.questions_created} questions.`;
    window.location.href = `embedding-confirmation.html?material_id=${result.material_id}`;
  } catch (err) {
    status.textContent = `Upload failed: ${err.message}`;
  }
});

(async () => {
  CURRENT_USER_ID = await requireLogin();
  if (!CURRENT_USER_ID) return;
  loadMaterials();
})();
</script>
