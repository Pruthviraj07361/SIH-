                "surface-variant": "#f4dfc7",

                "on-secondary": "#ffffff",
                "background": "#fff8f4",

<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden">
<header class="w-full px-md md:px-xl py-md max-w-[1280px] mx-auto flex items-center gap-md">
<div class="h-12 w-auto flex items-center">
  <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAt54tA0GPmJNAPQ0KrMMKCOcGtECWhe6Fpkt81SRfJKvzeZ9DLIuP1Fx7RbLg1H9kjup3lnwpz-haumjsSiCcjHFfzUsQ7Ex-cgvpyLYBhLcUCSov0m69tg2-WcOAV3CjpImKsMnWsi3NyhJVfS39E076y8-jyTYZeRWvjPSq7-ZzzLFVCndnh6KULxIAouAsNRAkYa4EEpkiSIOin9L3jZoqhz4aaWp0LdbZu8toQBIQRDBr2QekPGw" alt="SANKHYASETU Institutional Logo" class="h-full w-auto object-contain">
</div>
<h1 class="font-headline-md text-headline-md text-primary-container m-0 p-0 tracking-tight">SANKHYASETU</h1>
</header>

<main class="flex-grow flex items-center justify-center px-md py-xl">
<div class="w-full max-w-lg bg-surface-container-lowest border border-outline-variant rounded shadow-md p-lg relative">
<div class="absolute -top-6 left-1/2 -translate-x-1/2 w-16 h-16 bg-surface-container-low border border-outline-variant rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary-container text-3xl">badge</span>
</div>
<div class="text-center mt-6 mb-lg">
<h2 class="font-headline-md text-headline-md text-primary-container m-0 inline-block relative">
                Tell us about you
                <span class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-1/2 h-0.5 bg-accent-gold"></span>
</h2>
<p class="text-on-surface-variant mt-md">A few quick details to personalize your study plan.</p>
</div>

<div id="error-box" class="hidden bg-error-container text-on-error-container rounded p-sm mb-md text-sm"></div>

<form id="onboarding-form" class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="username">Username</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-outline pointer-events-none">
<span class="material-symbols-outlined text-xl">person</span>
</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-low border border-outline-variant rounded font-body-md text-on-surface-variant outline-none" id="username" type="text" readonly>
</div>
</div>

<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="department">Department</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-outline pointer-events-none">
<span class="material-symbols-outlined text-xl">account_tree</span>
</span>
<select class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded font-body-md text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-all outline-none" id="department" required>
<option disabled selected value="">Select your department</option>
<option value="Computer Science / IT">Computer Science / IT</option>
<option value="Statistics">Statistics</option>
<option value="Mathematics">Mathematics</option>
<option value="Electronics / EC">Electronics / EC</option>
<option value="Mechanical">Mechanical</option>
<option value="Civil">Civil</option>
<option value="Other">Other</option>
</select>
</div>
</div>

<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="age">Age</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-outline pointer-events-none">
<span class="material-symbols-outlined text-xl">cake</span>
</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded font-body-md text-on-surface placeholder:text-outline focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-all outline-none" id="age" min="10" max="100" placeholder="Enter your age" type="number" required>
</div>
</div>

<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="goal">Your Goal</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-outline pointer-events-none">
<span class="material-symbols-outlined text-xl">target</span>
</span>
<select class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded font-body-md text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/10 transition-all outline-none" id="goal" required>
<option disabled selected value="">Select your primary goal</option>
<option value="Exam preparation">Exam preparation</option>
<option value="Semester coursework">Semester coursework</option>
<option value="Competitive exam (GATE/etc.)">Competitive exam (GATE/etc.)</option>
<option value="General revision">General revision</option>
<option value="Other">Other</option>
</select>
</div>
</div>

<button class="mt-base w-full bg-primary-container text-on-primary py-3 px-4 rounded font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-primary transition-colors shadow-sm focus:ring-2 focus:ring-primary-container/50 outline-none" type="submit" id="submit-btn">
                <span id="submit-text">Continue to SANKHYASETU</span>
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
</div>
</main>

<script>
  const form = document.getElementById("onboarding-form");
  const errorBox = document.getElementById("error-box");
  const submitBtn = document.getElementById("submit-btn");
  const submitText = document.getElementById("submit-text");

  // Prefill the (read-only) username field from the signup metadata —
  // the person already chose it on the signup screen, no need to ask again.
  (async () => {
    const userId = await requireLogin();
    if (!userId) return;
    const { data: { user } } = await supabaseAuth.auth.getUser();
    document.getElementById("username").value = user?.user_metadata?.username || "";
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.add("hidden");
    submitBtn.disabled = true;
    submitText.textContent = "Saving...";

    const userId = await requireLogin();
    if (!userId) return;

    const formData = new FormData();
    formData.append("user_id", userId);
    formData.append("username", document.getElementById("username").value);
    formData.append("department", document.getElementById("department").value);
    formData.append("age", document.getElementById("age").value);
    formData.append("goal", document.getElementById("goal").value);

    try {
      await apiPostForm("/profile", formData);
      window.location.href = "dashboard.html";
    } catch (err) {
      errorBox.textContent = "Could not save your details. Please try again.";
      errorBox.classList.remove("hidden");
      submitBtn.disabled = false;
      submitText.textContent = "Continue to SANKHYASETU";
    }
  });
</script>
</body></html>
